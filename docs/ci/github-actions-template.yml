name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/final
      - owner/Maaskk

permissions:
  contents: read

env:
  PYTHONPATH: src
  TRAIN_SUBSETS: FD001
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NASA C-MAPSS data
        run: |
          python scripts/download_data.py

      - name: Run dlt ingestion and dbt checks
        run: |
          python orchestration/run_local.py

      - name: Train CI model artifact
        run: |
          python scripts/train_model.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Pytest data quality checks
        run: |
          python -m pytest tests/test_dataops.py

      - name: Compile check
        run: |
          python -m compileall src tests scripts orchestration ml-modeling

      - name: Ruff
        run: |
          ruff check .

      - name: Readiness
        run: |
          python scripts/check_readiness.py

      - name: Docker Compose config
        run: |
          docker compose config

      - name: Docker Compose build
        run: |
          docker compose build

      - name: Docker API smoke
        run: |
          docker compose up -d mlflow
          docker compose run --rm training-init
          docker compose up -d api
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://localhost:8000/health", timeout=2) as response:
                      body = json.loads(response.read().decode())
                  if body.get("status") == "ready":
                      print(json.dumps(body, indent=2, sort_keys=True))
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"API did not become ready: {last_error}")
          PY
          API_URL=http://localhost:8000 python scripts/smoke_predict.py

      - name: Docker cleanup
        if: always()
        run: |
          docker compose down -v
