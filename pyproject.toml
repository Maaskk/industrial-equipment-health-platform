[project]
name = "industrial-equipment-health-platform"
version = "0.1.0"
description = "Predictive maintenance MLOps and DataOps project."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "data",
  "models",
  "mlruns",
  "mlartifacts",
  "mlflow",
  "warehouse",
  "*.ipynb",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "PYTHONPATH=src python scripts/download_data.py && PYTHONPATH=src python orchestration/run_local.py && PYTHONPATH=src python scripts/train_model.py"
