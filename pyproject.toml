[project]
name = "industrial-equipment-health-platform"
version = "0.1.0"
description = "Predictive maintenance MLOps and DataOps project."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.138.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
mlops = [
  "duckdb==1.5.4",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "pandas==2.3.3",
  "numpy==2.5.1",
  "uvicorn==0.49.0",
  "joblib==1.5.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "data",
  "models",
  "mlruns",
  "mlartifacts",
  "mlflow",
  "warehouse",
  "*.ipynb",
]
