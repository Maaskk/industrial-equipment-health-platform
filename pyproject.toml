[project]
name = "industrial-equipment-health-platform"
version = "0.1.0"
description = "Predictive maintenance MLOps and DataOps project."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dlt==1.28.2",
  "duckdb==1.5.4",
  "dbt-core==1.11.12",
  "dbt-duckdb==1.10.1",
  "dagster==1.13.13",
  "dagster-webserver==1.13.13",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "pandas==2.3.3",
  "pyarrow==24.0.0",
  "numpy==2.5.1",
  "mlflow==3.14.0",
  "fastapi==0.138.0",
  "uvicorn==0.49.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "joblib==1.5.3",
  "matplotlib==3.11.0",
  "nbformat==5.10.4",
  "nbclient==0.11.0",
  "ipykernel==7.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "data",
  "models",
  "mlruns",
  "mlartifacts",
  "mlflow",
  "warehouse",
  "*.ipynb",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "PYTHONPATH=src python scripts/download_data.py && PYTHONPATH=src python orchestration/run_local.py && PYTHONPATH=src python scripts/train_model.py"
