x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-industrial-equipment-health-platform:latest}
  pull_policy: never
  environment: &app-env
    PYTHONPATH: /app/src
    CMAPSS_DATA_DIR: /app/data/raw
    DUCKDB_PATH: /app/warehouse/cmapss_ingestion.duckdb
    DBT_DUCKDB_PATH: /app/warehouse/cmapss_ingestion.duckdb
    DLT_DATA_DIR: /app/.dlt
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_NAME: industrial-equipment-health-model
    MODEL_ALIAS: champion
    MODEL_PATH: /app/models/latest/model.pkl
    FEATURE_SCHEMA_PATH: /app/models/latest/feature_schema.json
    PREDICTION_LOG_PATH: /app/logs/prediction_logs.jsonl
    TRAIN_SUBSETS: ${TRAIN_SUBSETS:-FD001 FD002 FD003 FD004}
    MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://exp.s3.fsbm.ma:3401}
    DAGSTER_PUBLIC_URL: ${DAGSTER_PUBLIC_URL:-http://exp.s3.fsbm.ma:3403}
    RELEASE_SHA: ${RELEASE_SHA:-unrecorded}
    RELEASE_TAG: ${RELEASE_TAG:-unreleased}
    RELEASE_BRANCH: ${RELEASE_BRANCH:-production}
    RELEASE_REPORT_PATH: /app/reports/release/final_release.json
  volumes:
    - data:/app/data
    - models:/app/models
    - logs:/app/logs
    - reports:/app/reports
    - warehouse:/app/warehouse
    - mlflow-storage:/app/mlflow

services:
  mlflow:
    <<: *app
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /app/mlflow/artifacts && exec mlflow server --backend-store-uri sqlite:////app/mlflow/mlflow.db --default-artifact-root /app/mlflow/artifacts --host 0.0.0.0 --port 5000 --workers 1"]
    environment:
      <<: *app-env
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:*,localhost:*,127.0.0.1:*,0.0.0.0:*,exp.s3.fsbm.ma:*
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MLFLOW_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 5m

  training-init:
    <<: *app
    restart: "no"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *app-env
      DAGSTER_HOME: /app/.dagster
    command: >
      sh -c "mkdir -p /app/data/raw /app/models /app/reports /app/warehouse /app/.dagster &&
             python scripts/download_data.py --data-dir /app/data/raw &&
             dagster job execute -m orchestration.dagster_assets -j final_mlops_job"
    volumes:
      - data:/app/data
      - models:/app/models
      - logs:/app/logs
      - reports:/app/reports
      - warehouse:/app/warehouse
      - dagster-storage:/app/.dagster
      - mlflow-storage:/app/mlflow

  api:
    <<: *app
    restart: unless-stopped
    depends_on:
      training-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    command: python scripts/run_api.py
    environment:
      <<: *app-env
      MODEL_SOURCE: mlflow
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2m

  dagster-webserver:
    <<: *app
    restart: unless-stopped
    depends_on:
      training-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DAGSTER_HOME: /app/.dagster
    command: ["sh", "-c", "mkdir -p /app/.dagster && exec dagster-webserver -m orchestration.dagster_assets -h 0.0.0.0 -p 3000"]
    volumes:
      - data:/app/data
      - models:/app/models
      - logs:/app/logs
      - reports:/app/reports
      - warehouse:/app/warehouse
      - dagster-storage:/app/.dagster
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DAGSTER_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2m

  dagster-daemon:
    <<: *app
    restart: unless-stopped
    depends_on:
      training-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DAGSTER_HOME: /app/.dagster
    command: ["sh", "-c", "mkdir -p /app/.dagster && exec dagster-daemon run -m orchestration.dagster_assets"]
    volumes:
      - data:/app/data
      - models:/app/models
      - logs:/app/logs
      - reports:/app/reports
      - warehouse:/app/warehouse
      - dagster-storage:/app/.dagster

volumes:
  data:
  models:
  logs:
  reports:
  warehouse:
  dagster-storage:
  mlflow-storage:
