name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
      - "release/**"

permissions:
  contents: read

env:
  PYTHONPATH: src
  TRAIN_SUBSETS: FD001
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked history
        uses: gitleaks/gitleaks-action@v2

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare empty DataOps workspace
        run: |
          dataops_root=$(mktemp -d)
          echo "CMAPSS_DATA_DIR=$dataops_root/data/raw" >> "$GITHUB_ENV"
          echo "DUCKDB_PATH=$dataops_root/warehouse/cmapss_ingestion.duckdb" >> "$GITHUB_ENV"
          echo "DBT_DUCKDB_PATH=$dataops_root/warehouse/cmapss_ingestion.duckdb" >> "$GITHUB_ENV"
          echo "DLT_DATA_DIR=$dataops_root/dlt-state" >> "$GITHUB_ENV"

      - name: Download NASA C-MAPSS data
        run: python scripts/download_data.py --data-dir "$CMAPSS_DATA_DIR"

      - name: Run dlt, dbt, and data contracts
        run: python orchestration/run_local.py

      - name: Train and register CI model
        run: python scripts/train_model.py

      - name: Unit and DataOps tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python -m pytest tests/test_dataops.py

      - name: Static quality gates
        run: |
          python -m compileall src tests scripts orchestration ml-modeling
          ruff check .
          python scripts/check_readiness.py
          docker compose config

      - name: Build containers
        run: docker compose build

      - name: Docker one-command smoke
        run: |
          docker compose up -d --wait mlflow
          docker compose run --rm training-init
          docker compose up -d --wait api
          python scripts/smoke_predict.py

      - name: Docker cleanup
        if: always()
        run: docker compose down -v
