name: Verify university release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag or commit deployed through Komodo
        required: true
        default: professor-demo-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Trigger the assigned Komodo Stack when configured
        env:
          KOMODO_STACK_WEBHOOK: ${{ secrets.KOMODO_STACK_WEBHOOK }}
        if: env.KOMODO_STACK_WEBHOOK != ''
        run: curl --fail --silent --show-error --request POST "$KOMODO_STACK_WEBHOOK"

      - name: Wait for the university application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://exp.s3.fsbm.ma:3402/health >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify dashboard, health, docs, and prediction
        run: |
          python scripts/verify_release.py \
            --base-url http://exp.s3.fsbm.ma:3402 \
            --expected-sha "$(git rev-parse HEAD)"
